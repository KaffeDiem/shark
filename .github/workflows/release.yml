# Every push to master builds the app, which keeps the Rust cache warm (caches saved on
# master are shared; unused caches are evicted after 7 days). If the merged PR has the
# "release" label, it also tags the built commit, publishes a GitHub release with the DMG,
# and commits the new version to Cargo.toml, the brew cask and the README.
name: release

on:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.label.outputs.release }}
    steps:
      - id: label
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name')
          echo "release=$(grep -qx release <<<"$labels" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Runs third-party language servers, so its token cannot write to the repository.
  tools:
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - id: pins
        run: echo "go=$(sed -n 's/^GO_VERSION=//p' scripts/build-gopls.sh)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache: false

      - run: rustup toolchain install

      - name: Build pinned gopls
        run: scripts/build-gopls.sh

      - name: Verify shipped language tools
        run: |
          rustup component add rust-analyzer rust-src
          python3 scripts/check-language-tools.py --self-test
          python3 scripts/check-language-tools.py

      # Artifacts drop file modes; the tarball keeps gopls executable.
      - uses: actions/upload-artifact@v4
        with:
          name: gopls
          path: target/language-tools/gopls-*-darwin-arm64.tar.gz*
          if-no-files-found: error

  build:
    needs: [check, tools]
    # tools is skipped for non-release pushes; a failed gate still blocks the build.
    if: ${{ !cancelled() && !failure() }}
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency: ${{ needs.check.outputs.release == 'true' && 'release' || format('build-{0}', github.run_id) }}
    env:
      RELEASE: ${{ needs.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Pushes use the deploy key; no token is left in .git/config for build scripts.
          persist-credentials: false

      - name: Pick version
        if: env.RELEASE == 'true'
        run: |
          v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Already released: bump the patch number. A re-run must not publish a second release.
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            if [ "$GITHUB_RUN_ATTEMPT" != 1 ]; then echo "v$v exists; re-runs don't release again"; exit 1; fi
            v=$(echo "$v" | awk -F. '{print $1"."$2"."$3+1}')
            sed -i '' "1,/^version = /s/^version = .*/version = \"$v\"/" Cargo.toml
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2

      - uses: actions/download-artifact@v4
        if: env.RELEASE == 'true'
        with:
          name: gopls
          path: target/language-tools

      - name: Unpack verified gopls
        if: env.RELEASE == 'true'
        run: |
          cd target/language-tools
          archive=$(ls gopls-*-darwin-arm64.tar.gz)
          shasum -a 256 -c "$archive.sha256"
          version=${archive#gopls-}
          version=${version%-darwin-arm64.tar.gz}
          mkdir -p "gopls/$version"
          tar -xzf "$archive" -C "gopls/$version"

      - if: env.RELEASE != 'true'
        run: cargo build --release

      - if: env.RELEASE == 'true'
        run: make release

      - name: Publish release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          # The repository deploy key can bypass PR review, but not force-push or deletion rules.
          : "${RELEASE_DEPLOY_KEY:?Missing release deploy key}"
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$RELEASE_DEPLOY_KEY" > "$key_dir/key"
          chmod 600 "$key_dir/key"
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          export GIT_SSH_COMMAND="ssh -F /dev/null -i '$key_dir/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$key_dir/known_hosts'"
          sha=$(shasum -a 256 "target/release/Shark-$VERSION.dmg" | cut -d' ' -f1)
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/shark.rb
          sed -i '' -E "s#(releases/download/v)[^/]+/Shark-[^)]+\.dmg#\1$VERSION/Shark-$VERSION.dmg#; s/Download Shark [0-9.]+/Download Shark $VERSION/" README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release $VERSION"
          # The tag points at exactly the code that was built, however far master has moved.
          git tag "v$VERSION"
          git push "git@github.com:$GITHUB_REPOSITORY.git" "v$VERSION"
          gh release create "v$VERSION" "target/release/Shark-$VERSION.dmg" target/language-tools/gopls-*-darwin-arm64.tar.gz target/language-tools/gopls-*-darwin-arm64.tar.gz.sha256 --title "Shark $VERSION" --generate-notes --verify-tag
          # Then carry the version commit onto master; retry if more merges land meanwhile.
          for _ in 1 2 3 4 5; do
            git pull --rebase "git@github.com:$GITHUB_REPOSITORY.git" master && git push "git@github.com:$GITHUB_REPOSITORY.git" HEAD:master && exit 0
            sleep 5
          done
          exit 1
