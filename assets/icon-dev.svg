    <rect x="176" y="662" width="672" height="20" rx="10"/>
    <path d="M190 570 L370 556 A12 12 0 0 1 370 580 Z"/>
    <path d="M262 622 L390 612 A9 9 0 0 1 390 630 Z"/>
