<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Dev build: same silhouette, fin and waterline as icon.svg on an amber blueprint, so it never passes for release -->
    <path id="body" d="M398.1 100 H625.9 C711.7 100 754.7 100 800.9 114.6 C851.3 133 891 172.7 909.4 223.1 C924 269.3 924 312.3 924 398.1 V625.9 C924 711.7 924 754.7 909.4 800.9 C891 851.3 851.3 891 800.9 909.4 C754.7 924 711.7 924 625.9 924 H398.1 C312.3 924 269.3 924 223.1 909.4 C172.7 891 133 851.3 114.6 800.9 C100 754.7 100 711.7 100 625.9 V398.1 C100 312.3 100 269.3 114.6 223.1 C133 172.7 172.7 133 223.1 114.6 C269.3 100 312.3 100 398.1 100Z"/>
    <path id="fin" d="M750 690 C742.5 520.5 554 313.7 308.2 205 Q262 186 292.3 225.8 C394.5 369.6 463.2 571.4 392 690 Z"/>
    <linearGradient id="amber" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA53A"/>
      <stop offset="1" stop-color="#E2620E"/>
    </linearGradient>
    <!-- 50px minor and 200px major grid, aligned to the waterline at y=690 -->
    <pattern id="grid" x="12" y="90" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0 H0 V50" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="2"/>
    </pattern>
    <pattern id="major-grid" x="112" y="90" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M200 0 H0 V200" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3"/>
    </pattern>
    <clipPath id="sq"><use href="#body"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <use href="#body" filter="url(#shadow)"/>
  <use href="#body" fill="url(#amber)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#grid)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#major-grid)"/>
    <use href="#fin" fill="#fff"/>
    <rect x="100" y="690" width="824" height="234" fill="#8A2E00" fill-opacity=".55"/>
  </g>
</svg>
