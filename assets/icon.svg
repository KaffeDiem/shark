<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Continuous-corner (squircle) body, 824px on the 1024 grid, fitted to Xcode's macOS 26 silhouette -->
    <path id="body" d="M398.1 100 H625.9 C711.7 100 754.7 100 800.9 114.6 C851.3 133 891 172.7 909.4 223.1 C924 269.3 924 312.3 924 398.1 V625.9 C924 711.7 924 754.7 909.4 800.9 C891 851.3 851.3 891 800.9 909.4 C754.7 924 711.7 924 625.9 924 H398.1 C312.3 924 269.3 924 223.1 909.4 C172.7 891 133 851.3 114.6 800.9 C100 754.7 100 711.7 100 625.9 V398.1 C100 312.3 100 269.3 114.6 223.1 C133 172.7 172.7 133 223.1 114.6 C269.3 100 312.3 100 398.1 100Z"/>
    <!-- swept fin: convex leading edge (right), needle tip raked back, concave trailing edge -->
    <path id="fin-shape" d="M792 668 C 758 498, 616 316, 308 244 C 446 344, 488 520, 424 668 Z"/>
    <linearGradient id="bg" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#16171C"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <!-- soft light from above -->
    <radialGradient id="toplight" cx="512" cy="40" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".8" stop-color="#fff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="fin" x1="360" y1="250" x2="760" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset=".5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="finsheen" x1="0" y1="250" x2="0" y2="668" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="water" x1="180" y1="0" x2="844" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset=".4" stop-color="#7DD3FC" stop-opacity=".85"/>
      <stop offset=".8" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="speed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0"/>
      <stop offset="1" stop-color="#67E8F9" stop-opacity=".9"/>
    </linearGradient>
    <!-- glow under the waterline, squashed to an ellipse centred on y=712 -->
    <radialGradient id="bloom" cx="580" cy="712" r="340" gradientTransform="translate(0 356) scale(1 .5)" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F7BF7" stop-opacity=".40"/>
      <stop offset=".55" stop-color="#6366F1" stop-opacity=".12"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="edge" x1="308" y1="244" x2="792" y2="668" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".6" stop-color="#fff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="finclip"><use href="#fin-shape"/></clipPath>
    <clipPath id="sq"><use href="#body"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <!-- shadow from its own copy: filtering the dark gradient directly bands it -->
  <use href="#body" filter="url(#shadow)"/>
  <use href="#body" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#toplight)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#bloom)"/>
    <!-- faint halo behind the fin -->
    <use href="#fin-shape" fill="url(#fin)" opacity=".12" filter="url(#glow)" transform="translate(0 36)"/>
  </g>
  <use href="#body" fill="none" stroke="url(#rim)" stroke-width="8" clip-path="url(#sq)"/>
  <g transform="translate(0 36)">
    <use href="#fin-shape" fill="url(#fin)"/>
    <use href="#fin-shape" fill="url(#finsheen)"/>
    <!-- fine light edge along the leading edge -->
    <path d="M792 668 C 758 498, 616 316, 308 244" fill="none" stroke="url(#edge)" stroke-width="5" clip-path="url(#finclip)"/>
    <rect x="176" width="672" y="662" height="20" rx="10" fill="url(#water)"/>
    <!-- tapered speed lines trailing left of the fin -->
    <path d="M190 570 L370 556 A12 12 0 0 1 370 580 Z" fill="url(#speed)"/>
    <path d="M262 622 L390 612 A9 9 0 0 1 390 630 Z" fill="url(#speed)"/>
  </g>
</svg>
