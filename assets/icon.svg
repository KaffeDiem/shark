<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Continuous-corner (squircle) body, 824px on the 1024 grid, fitted to Xcode's macOS 26 silhouette -->
    <path id="body" d="M398.1 100 H625.9 C711.7 100 754.7 100 800.9 114.6 C851.3 133 891 172.7 909.4 223.1 C924 269.3 924 312.3 924 398.1 V625.9 C924 711.7 924 754.7 909.4 800.9 C891 851.3 851.3 891 800.9 909.4 C754.7 924 711.7 924 625.9 924 H398.1 C312.3 924 269.3 924 223.1 909.4 C172.7 891 133 851.3 114.6 800.9 C100 754.7 100 711.7 100 625.9 V398.1 C100 312.3 100 269.3 114.6 223.1 C133 172.7 172.7 133 223.1 114.6 C269.3 100 312.3 100 398.1 100Z"/>
    <!-- fin heading right: convex leading edge, tapered tip raked back, hooked trailing edge; base on the waterline -->
    <path id="fin" d="M750 690 C742.5 520.5 554 313.7 308.2 205 Q262 186 292.3 225.8 C394.5 369.6 463.2 571.4 392 690 Z"/>
    <linearGradient id="sea" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2A9BEF"/>
      <stop offset="1" stop-color="#0B4FAE"/>
    </linearGradient>
    <linearGradient id="finfill" x1="0" y1="186" x2="0" y2="690" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF"/>
      <stop offset="1" stop-color="#DDEBF8"/>
    </linearGradient>
    <clipPath id="sq"><use href="#body"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".3"/>
    </filter>
  </defs>
  <!-- shadow from its own copy: filtering the gradient directly bands it -->
  <use href="#body" filter="url(#shadow)"/>
  <use href="#body" fill="url(#sea)"/>
  <g clip-path="url(#sq)">
    <use href="#fin" fill="url(#finfill)"/>
    <!-- water: a deeper tone below the waterline, translucent so the tile gradient carries through -->
    <rect x="100" y="690" width="824" height="234" fill="#062F72" fill-opacity=".7"/>
  </g>
</svg>
