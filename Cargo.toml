[package]
name = "shark"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"

[profile.dev.package."*"]
opt-level = 3

[features]
# Headless UI tests: cargo test --features test-support
test-support = ["gpui-kit/test-support"]
