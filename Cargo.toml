[package]
name = "shark"
version = "0.1.1"
edition = "2024"
license-file = "LICENSE"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSDictionary", "NSValue", "NSURL", "NSArray"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-core-video", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVTime", "AVAssetTrack", "AVMediaFormat", "AVVideoComposition", "objc2-core-foundation"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
imagesize = "0.14"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes"] }
resvg = { version = "0.46", default-features = false }

[profile.dev.package."*"]
opt-level = 3

[features]
# Headless UI tests: cargo test --features test-support
test-support = ["gpui-kit/test-support"]
