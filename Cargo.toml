[package]
name = "shark"
version = "0.1.16"
edition = "2024"
license-file = "LICENSE"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"
smallvec = "1"
unicode-segmentation = "1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSDockTile", "NSImage", "NSResponder", "NSWorkspace", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSString", "NSDictionary", "NSValue", "NSURL", "NSArray", "NSGeometry", "NSFileManager", "NSError", "NSDate", "NSDateFormatter", "NSISO8601DateFormatter", "NSFormatter", "NSTimeZone"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-media", "objc2-core-video", "AVPlayer", "AVPlayerItem", "AVPlayerItemOutput", "AVAsset", "AVTime", "AVAssetTrack", "AVMediaFormat", "AVVideoComposition", "objc2-core-foundation"] }
objc2-core-video = { version = "0.3", default-features = false, features = ["std", "CVPixelBuffer", "CVBuffer", "CVImageBuffer", "CVReturn"] }
objc2-core-media = { version = "0.3", default-features = false, features = ["std", "CMTime"] }
imagesize = "0.14"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFCGTypes", "CFArray", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGImage"] }
objc2-core-services = { version = "0.3", default-features = false, features = ["std", "LaunchServices", "LSInfo", "LSConstants"] }
resvg = { version = "0.46", default-features = false }
lsp-server = "=0.10.0"
lsp-types = "=0.97.0"
anyhow = "1"
async-channel = "2"
globset = "0.4"
ignore = "0.4"
url = "2"
toml = "0.9"

[profile.dev.package."*"]
opt-level = 3

[features]
# Headless UI tests: cargo test --features test-support
test-support = ["gpui-kit/test-support"]

# Real Metal rendering needs the main thread; opt in with --test rendering.
[[test]]
name = "rendering"
path = "tests/rendering.rs"
harness = false
test = false
required-features = ["test-support"]

