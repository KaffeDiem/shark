[package]
name = "shark"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE"

[dependencies]
gpui-kit = { version = "=0.8.0", features = ["syntect"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[profile.dev.package."*"]
opt-level = 3

[features]
# Headless UI tests: cargo test --features test-support
test-support = ["gpui-kit/test-support"]
